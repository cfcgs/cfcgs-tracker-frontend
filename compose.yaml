services:
  frontend:
    container_name: cfcgs_frontend
    image: cfcgs-frontend:standalone
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_TUTORIAL_ENABLED: ${VITE_TUTORIAL_ENABLED}
        VITE_EVALUATION_FORM_URL: ${VITE_EVALUATION_FORM_URL}
    ports:
      - "8080:80"
